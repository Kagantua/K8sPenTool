name: Build JAR with Maven

on:
  push:
    branches: [ main, master ]   # 可根据你的主分支名称调整
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:              # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'   # Eclipse Temurin (原 AdoptOpenJDK)
        cache: maven              # 缓存 Maven 依赖，加速构建

    - name: Build with Maven
      run: mvn clean package

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: k8s-pen-tool-jar
        path: target/k8s-pen-tool-*.jar   # 匹配你 pom.xml 中定义的最终名称
        if-no-files-found: error

    # 可选：若需要自动创建 Release 并上传 JAR
    # - name: Create Release and Upload Asset
    #   if: startsWith(github.ref, 'refs/tags/')
